<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Factory · 内容工厂</title>
<style>
  :root {
    --ink: #14161d;         /* 深墨蓝底 */
    --ink-2: #1b1e27;
    --panel: #1e212b;
    --line: #2c303c;
    --text: #e8e6e1;        /* 暖白 */
    --muted: #8a8f9e;
    --amber: #e8a33d;       /* 主色：摄影棚暖光 */
    --amber-soft: rgba(232,163,61,.14);
    --cyan: #4aa8c0;        /* 副色：音频电平 */
    --ok: #67b87d;
    --err: #e0655a;
    --mono: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ink); color: var(--text);
    font-family: var(--sans); line-height: 1.6;
    padding: 28px 32px 60px; min-height: 100vh;
  }
  .topbar { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .topbar h1 { font-size: 22px; letter-spacing: .5px; font-weight: 650; }
  .topbar .brand { color: var(--amber); font-family: var(--mono); font-size: 22px; }
  .topbar .sub { color: var(--muted); font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .iconbtn { background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .iconbtn:hover { border-color: var(--amber); color: var(--amber); }

  /* 生产线 —— 签名元素 */
  .line { display: flex; align-items: stretch; gap: 0; margin-bottom: 26px; }
  .station { flex: 1; position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 14px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .station + .station { margin-left: 10px; }
  .station:hover { border-color: var(--amber); transform: translateY(-1px); }
  .station.done { border-color: rgba(232,163,61,.5); }
  .station .num { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: 1px; }
  .station .name { font-size: 14px; margin-top: 2px; font-weight: 600; }
  .station .desc { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .station .dot { position: absolute; top: 13px; right: 14px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--line); transition: background .3s; }
  .station.done .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .panel h2 { font-size: 14px; margin-bottom: 14px; font-weight: 600; letter-spacing: .3px; }
  .panel h2::before { content: "// "; color: var(--amber); font-family: var(--mono); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  textarea, input[type=text] {
    width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); padding: 11px 12px; font-size: 14px; font-family: inherit;
    transition: border-color .2s;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--amber); }
  textarea { min-height: 150px; resize: vertical; }

  .drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center;
    font-size: 13px; color: var(--muted); cursor: pointer; transition: all .2s; }
  .drop:hover, .drop.on { border-color: var(--amber); color: var(--text); background: var(--amber-soft); }
  .drop.has { color: var(--ok); border-color: var(--ok); }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  button {
    background: var(--amber); color: #1a1408; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }

  #status { margin-top: 14px; font-size: 13px; color: var(--muted); white-space: pre-wrap; min-height: 20px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--amber); border-radius: 50%; animation: r .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* 结果区 */
  .artifact { border-top: 1px solid var(--line); padding: 14px 0; }
  .artifact:first-child { border-top: none; padding-top: 0; }
  .artifact .cap { font-family: var(--mono); font-size: 11px; color: var(--cyan); letter-spacing: .5px; margin-bottom: 8px; }
  .artifact textarea, .artifact pre { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); padding: 12px; font-size: 13px; white-space: pre-wrap; max-height: 360px; overflow: auto; }
  video, audio { width: 100%; border-radius: 8px; outline: none; }
  img.prev { max-width: 100%; border-radius: 8px; display: block; }

  /* 任务列表 */
  .task { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .task-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; cursor: pointer; transition: background .15s; }
  .task-head:hover { background: var(--ink-2); }
  .task-head .tid { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .task-head .meta { font-size: 11px; color: var(--muted); }
  .task-head .chev { color: var(--muted); transition: transform .2s; font-size: 12px; }
  .task.open .chev { transform: rotate(90deg); }
  .task-body { display: none; padding: 4px 14px 14px; border-top: 1px solid var(--line); background: var(--ink-2); }
  .task.open .task-body { display: block; }
  .task-body .mini-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .task-body .mini-links a { color: var(--cyan); text-decoration: none; font-size: 12px; font-family: var(--mono); }
  .task-body .mini-links a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

  /* 配置弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.show { display: flex; }
  .cfg-modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: 560px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .cfg-head { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .cfg-head .x { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  .cfg-body { padding: 18px 20px; overflow-y: auto; }
  .cfg-body section { margin-bottom: 20px; }
  .cfg-body section h3 { font-size: 13px; margin-bottom: 10px; color: var(--text); }
  .cfg-body section h3::before { content: "// "; color: var(--amber); font-family: var(--mono); }
  .cfg-body select { width: 100%; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); padding: 9px 10px; font-size: 13px; margin-bottom: 8px; }
  .cfg-body .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .cfg-body .row input { flex: 1; }
  .cfg-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
  .custom-item { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
  .custom-item .del { background: none; border: none; color: var(--err); cursor: pointer; font-size: 13px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">▮▮</span>
    <h1>Media Factory</h1>
    <span class="sub">自媒体内容生产线：改写 · 生图 · 播客 · 视频（含字幕）</span>
    <span class="spacer"></span>
    <button class="iconbtn" onclick="openConfig()">⚙ 配置</button>
  </div>

  <div class="line">
    <div class="station" data-step="rewrite" onclick="run('rewrite')">
      <span class="num">STEP 01</span><span class="dot"></span>
      <div class="name">改写</div><div class="desc">爆款文案</div>
    </div>
    <div class="station" data-step="image" onclick="run('image')">
      <span class="num">STEP 02</span><span class="dot"></span>
      <div class="name">生图</div><div class="desc">核心意象配图</div>
    </div>
    <div class="station" data-step="podcast" onclick="run('podcast')">
      <span class="num">STEP 03</span><span class="dot"></span>
      <div class="name">播客</div><div class="desc">双人对话音频</div>
    </div>
    <div class="station" data-step="video" onclick="run('video')">
      <span class="num">STEP 04</span><span class="dot"></span>
      <div class="name">视频</div><div class="desc">图片 + 音频 + 字幕</div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>投料</h2>
      <div class="field">
        <label>参考文案（必填）</label>
        <textarea id="text" placeholder="粘贴要改写的参考文案…"></textarea>
      </div>
      <div class="field">
        <label>改写要求（可选，叠加在系统爆款要求之上）</label>
        <textarea id="prompt" style="min-height:60px" placeholder="如：面向小红书，语气活泼，多用 emoji，500 字左右"></textarea>
      </div>
      <div class="field">
        <label>生图要求（可选，如画面风格/配色）</label>
        <textarea id="imagePrompt" style="min-height:50px" placeholder="如：扁平插画风，暖色调，扁平化构图"></textarea>
      </div>
      <div class="field">
        <label>播客风格要求（可选）</label>
        <textarea id="podcastPrompt" style="min-height:50px" placeholder="如：轻松幽默，两位主播多互动"></textarea>
      </div>
      <div class="field">
        <label>参考图（可选，作为生图参考）</label>
        <div class="drop" id="drop">点击或拖拽图片到这里上传</div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="field">
        <label>任务 ID（可选，留空自动生成；续跑时填已有任务）</label>
        <input type="text" id="taskId" placeholder="如 20260830-171442">
      </div>
      <div class="btns">
        <button onclick="run('run')">一键全流程</button>
        <button class="ghost" onclick="run('rewrite')">仅改写</button>
        <button class="ghost" onclick="run('image')">仅生图</button>
        <button class="ghost" onclick="run('podcast')">仅播客</button>
        <button class="ghost" onclick="run('video')">仅视频</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="panel">
      <h2>最新产出</h2>
      <div id="result"><div class="empty">尚未产出，点击上方「一键全流程」开始</div></div>
      <h2 style="margin-top:22px">任务档案</h2>
      <div id="tasks"></div>
    </div>
  </div>

<script>
const state = { refPath: null, fileName: null, currentId: null };
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');

drop.addEventListener('click', () => fileInput.click());
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) upload(f); });

async function upload(file) {
  setStatus('上传中…');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      state.refPath = data.path; state.fileName = file.name;
      drop.textContent = '✓ ' + file.name; drop.classList.add('has');
      setStatus('参考图已上传');
    } else { setStatus('上传失败：' + data.error, true); }
  } catch (e) { setStatus('上传失败：' + e.message, true); }
}

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.className = isErr ? 'err' : '';
  el.innerHTML = msg;
}

async function run(step) {
  const text = document.getElementById('text').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const imagePrompt = document.getElementById('imagePrompt').value.trim();
  const podcastPrompt = document.getElementById('podcastPrompt').value.trim();
  const id = document.getElementById('taskId').value.trim() || null;
  const status = document.getElementById('status');
  if (step === 'run' || step === 'rewrite') { if (!text) { setStatus('请先填写参考文案', true); return; } }
  if (step === 'run' || step === 'image' || step === 'video' || step === 'podcast') {
    if (!id && !state.currentId && !(step === 'rewrite' || step === 'run')) { setStatus('续跑需要任务 ID（先跑过改写/全流程，或手动填写）', true); return; }
  }

  setStatus('<span class="spin"></span>' + (step === 'video' ? '视频合成含字幕，可能需要 10–20 分钟，请耐心等待…' : '处理中…'));
  const body = {};
  if (step === 'run' || step === 'rewrite') body.text = text;
  if ((step === 'run' || step === 'rewrite') && prompt) body.prompt = prompt;
  if (step === 'run' && imagePrompt) body.image_prompt = imagePrompt;
  if (step === 'image' && imagePrompt) body.prompt = imagePrompt;
  if (step === 'run' && podcastPrompt) body.podcast_prompt = podcastPrompt;
  if (step === 'podcast' && podcastPrompt) body.prompt = podcastPrompt;
  if (id) body.id = id; else if (state.currentId && step !== 'rewrite' && step !== 'run') body.id = state.currentId;
  if ((step === 'run' || step === 'image') && state.refPath) body.ref_image = state.refPath;

  try {
    const res = await fetch('/api/' + step, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.ok) {
      if (data.id) { state.currentId = data.id; document.getElementById('taskId').value = data.id; }
      setStatus('✓ ' + (data.message || '完成'));
      renderResult(data);
      markDone(step);
      loadTasks();
    } else { setStatus('出错：' + (data.error || '未知'), true); }
  } catch (e) { setStatus('请求失败：' + e.message, true); }
}

function markDone(step) {
  const order = ['rewrite','image','podcast','video'];
  const idx = order.indexOf(step);
  order.forEach((s, i) => {
    const st = document.querySelector(`.station[data-step="${s}"]`);
    if (i <= idx) st.classList.add('done');
  });
}

function renderResult(data) {
  const id = data.id;
  const el = document.getElementById('result');
  el.innerHTML = '';
  const names = (data.artifacts || []).map(a => a.name);
  // 改写文案
  if (names.includes('rewritten.md')) {
    el.appendChild(block('改写文案', 'textarea', id, 'rewritten.md'));
  }
  // 脚本（若存在）
  if (names.includes('script.md')) {
    el.appendChild(block('播客脚本', 'pre', id, 'script.md'));
  }
  // 字幕
  if (names.includes('subtitle.srt')) {
    el.appendChild(block('字幕', 'pre', id, 'subtitle.srt'));
  }
  // 图片
  if (names.includes('image.png')) {
    el.appendChild(mediaBlock('配图', `<img class="prev" src="/api/files/${id}/image.png">`));
  }
  // 音频
  if (names.includes('podcast.mp3')) {
    el.appendChild(mediaBlock('播客音频', `<audio controls src="/api/files/${id}/podcast.mp3"></audio>`));
  }
  // 视频
  if (names.includes('video.mp4')) {
    el.appendChild(mediaBlock('成品视频', `<video controls src="/api/files/${id}/video.mp4"></video>`));
  }
}

function block(caption, kind, id, name) {
  const d = document.createElement('div');
  d.className = 'artifact';
  d.innerHTML = `<div class="cap">${caption} · ${name}</div>`;
  const el = document.createElement(kind);
  el.dataset.src = `/api/files/${id}/${name}`;
  d.appendChild(el);
  fetch(el.dataset.src).then(r => r.text()).then(t => { el.textContent = t; });
  return d;
}

function mediaBlock(caption, html) {
  const d = document.createElement('div');
  d.className = 'artifact';
  d.innerHTML = `<div class="cap">${caption}</div>${html}`;
  return d;
}

async function loadTasks() {
  const res = await fetch('/api/tasks');
  const data = await res.json();
  const el = document.getElementById('tasks');
  el.innerHTML = '';
  const tasks = data.tasks || [];
  if (!tasks.length) { el.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  for (const t of tasks) {
    const names = (t.artifacts || []).map(a => a.name);
    const d = document.createElement('div');
    d.className = 'task';
    d.innerHTML = `
      <div class="task-head">
        <span class="tid">${t.id}</span>
        <span class="meta">${names.length} 个产物</span>
        <span class="chev">▶</span>
      </div>
      <div class="task-body"></div>`;
    const head = d.querySelector('.task-head');
    head.onclick = () => { d.classList.toggle('open'); if (d.classList.contains('open')) renderTaskBody(d.querySelector('.task-body'), t); };
    el.appendChild(d);
  }
}

function renderTaskBody(box, t) {
  box.innerHTML = '';
  if (!t.artifacts.length) { box.innerHTML = '<div class="empty">无产物</div>'; return; }
  let links = '';
  for (const a of t.artifacts) links += `<a href="${a.url}" target="_blank">${a.name}</a>`;
  box.innerHTML = `<div class="mini-links">${links}</div>`;
  const names = t.artifacts.map(a => a.name);
  if (names.includes('rewritten.md')) box.appendChild(block('改写文案', 'textarea', t.id, 'rewritten.md'));
  if (names.includes('image.png')) box.appendChild(mediaBlock('配图', `<img class="prev" src="/api/files/${t.id}/image.png">`));
  if (names.includes('podcast.mp3')) box.appendChild(mediaBlock('播客音频', `<audio controls src="/api/files/${t.id}/podcast.mp3"></audio>`));
  if (names.includes('video.mp4')) box.appendChild(mediaBlock('成品视频', `<video controls src="/api/files/${t.id}/video.mp4"></video>`));
}

loadTasks();

/* ===== 配置面板 ===== */
const IMAGE_BUILTINS = [
  { key: 'nano-banana', label: 'nano-banana（官方 Gemini 生图）' },
  { key: 'openai-image', label: 'openai-image（gpt-image）' },
  { key: 'doubao-seedream', label: 'doubao-seedream（豆包生图）' },
];
const PODCAST_BUILTINS = [
  { key: 'volc-podcast', label: 'volc-podcast（火山播客大模型，推荐）', extra: ['appid'] },
  { key: 'openai-tts', label: 'openai-tts（通用 TTS）' },
  { key: 'gemini-tts', label: 'gemini-tts（通用 TTS）' },
  { key: 'volc-tts', label: 'volc-tts（火山豆包语音）', extra: ['appid'] },
];
let CFG = null; // 当前配置对象
let CFG_MODELS = []; // pi 可用模型

async function openConfig() {
  document.getElementById('cfgOverlay').classList.add('show');
  const res = await fetch('/api/config');
  const data = await res.json();
  CFG = data.config || { tasks: {}, providers: {} };
  CFG_MODELS = data.models || [];
  CFG.providers = CFG.providers || {};
  CFG.tasks = CFG.tasks || {};
  renderConfig();
}
function closeConfig() { document.getElementById('cfgOverlay').classList.remove('show'); }

function customNames() {
  return Object.entries(CFG.providers)
    .filter(([, p]) => p.type === 'openai-compatible')
    .map(([n]) => n);
}

function renderConfig() {
  // 语言模型
  const llm = document.getElementById('cfgLlm');
  llm.innerHTML = '<option value="">使用 pi 默认模型</option>';
  for (const m of CFG_MODELS) llm.innerHTML += `<option value="${m}">${m}</option>`;
  const curLlm = CFG.tasks.llm?.model || '';
  llm.value = curLlm;

  // 生图
  const img = document.getElementById('cfgImage');
  const customs = customNames();
  img.innerHTML = '';
  for (const b of IMAGE_BUILTINS) img.innerHTML += `<option value="${b.key}">${b.label}</option>`;
  for (const c of customs) img.innerHTML += `<option value="${c}">${c}（自定义）</option>`;
  const imgSel = CFG.tasks.image?.provider || 'nano-banana';
  img.value = imgSel;
  img.onchange = () => renderProviderFields();

  // 播客
  const pod = document.getElementById('cfgPodcast');
  pod.innerHTML = '';
  for (const b of PODCAST_BUILTINS) pod.innerHTML += `<option value="${b.key}">${b.label}</option>`;
  for (const c of customs) pod.innerHTML += `<option value="${c}">${c}（自定义）</option>`;
  const podSel = CFG.tasks.podcast?.provider || 'volc-podcast';
  pod.value = podSel;
  pod.onchange = () => renderProviderFields();

  renderProviderFields();
  renderCustoms();
}

function maskKey(k) {
  if (!k) return '';
  if (k.length <= 8) return '••••••••';
  return k.slice(0, 4) + '••••' + k.slice(-4);
}

function renderProviderFields() {
  // 生图 key 输入（脱敏显示，不填新值则保留原值）
  const imgSel = document.getElementById('cfgImage').value;
  const imgKeyWrap = document.getElementById('imgKeyWrap');
  const isImgBuiltin = IMAGE_BUILTINS.some(b => b.key === imgSel);
  imgKeyWrap.style.display = isImgBuiltin ? 'block' : 'none';
  if (isImgBuiltin) {
    const p = CFG.providers[imgSel];
    const key = p?.api_key || '';
    const inp = document.getElementById('cfgImageKey');
    inp.value = '';
    inp.placeholder = key ? '已配置 ' + maskKey(key) + '（留空保持原值）' : 'API Key';
  }

  // 播客 key + appid
  const podSel = document.getElementById('cfgPodcast').value;
  const podKeyWrap = document.getElementById('podKeyWrap');
  const podAppidWrap = document.getElementById('podAppidWrap');
  const b = PODCAST_BUILTINS.find(x => x.key === podSel);
  const isPodBuiltin = !!b;
  podKeyWrap.style.display = isPodBuiltin ? 'block' : 'none';
  podAppidWrap.style.display = (isPodBuiltin && b.extra?.includes('appid')) ? 'block' : 'none';
  if (isPodBuiltin) {
    const p = CFG.providers[podSel];
    const key = p?.api_key || '';
    const keyInp = document.getElementById('cfgPodcastKey');
    keyInp.value = '';
    keyInp.placeholder = key ? '已配置 ' + maskKey(key) + '（留空保持原值）' : 'Access Token / API Key';
    // appid 非密钥，明文展示
    document.getElementById('cfgPodcastAppid').value = p?.extra?.appid || '';
  }
}

function renderCustoms() {
  const el = document.getElementById('cfgCustoms');
  el.innerHTML = '';
  const customs = customNames();
  if (!customs.length) { el.innerHTML = '<div class="hint">暂无自定义 provider，可在下方添加</div>'; }
  for (const n of customs) {
    const p = CFG.providers[n];
    const d = document.createElement('div');
    d.className = 'custom-item';
    d.innerHTML = `<span><b>${n}</b> · ${p.model} · ${p.base_url}</span><button class="del" data-n="${n}">删除</button>`;
    d.querySelector('.del').onclick = () => {
      delete CFG.providers[n];
      renderConfig();
    };
    el.appendChild(d);
  }
}

function addCustom() {
  const name = document.getElementById('cName').value.trim();
  const base = document.getElementById('cBase').value.trim();
  const key = document.getElementById('cKey').value.trim();
  const model = document.getElementById('cModel').value.trim();
  if (!name || !base || !model) { alert('名称 / BaseURL / 模型名 必填'); return; }
  CFG.providers[name] = { type: 'openai-compatible', base_url: base, api_key: key, model };
  document.getElementById('cName').value = '';
  document.getElementById('cBase').value = '';
  document.getElementById('cKey').value = '';
  document.getElementById('cModel').value = '';
  renderConfig();
}

async function saveConfig() {
  // 汇总语言模型
  const llm = document.getElementById('cfgLlm').value;
  CFG.tasks.llm = llm ? { model: llm } : null;

  // 生图
  const imgSel = document.getElementById('cfgImage').value;
  CFG.tasks.image = { provider: imgSel };
  if (IMAGE_BUILTINS.some(b => b.key === imgSel)) {
    const existing = CFG.providers[imgSel];
    const newKey = document.getElementById('cfgImageKey').value.trim();
    const key = newKey || existing?.api_key || '';
    CFG.providers[imgSel] = { type: 'builtin', kind: imgSel, api_key: key, extra: existing?.extra || {} };
  }

  // 播客
  const podSel = document.getElementById('cfgPodcast').value;
  CFG.tasks.podcast = { provider: podSel };
  const b = PODCAST_BUILTINS.find(x => x.key === podSel);
  if (b) {
    const existing = CFG.providers[podSel];
    const newKey = document.getElementById('cfgPodcastKey').value.trim();
    const key = newKey || existing?.api_key || '';
    const extra = { ...(existing?.extra || {}) };
    if (b.extra?.includes('appid')) {
      const appidVal = document.getElementById('cfgPodcastAppid').value.trim();
      if (appidVal) extra.appid = appidVal;
    }
    CFG.providers[podSel] = { type: 'builtin', kind: podSel, api_key: key, extra };
  }

  const res = await fetch('/api/config', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(CFG) });
  const data = await res.json();
  if (data.ok) { closeConfig(); setStatus('✓ 配置已保存'); }
  else alert('保存失败：' + (data.error || '未知'));
}
</script>
  <div class="overlay" id="cfgOverlay">
    <div class="cfg-modal">
      <div class="cfg-head">
        <span>Agent 配置</span>
        <button class="x" onclick="closeConfig()">×</button>
      </div>
      <div class="cfg-body">
        <section>
          <h3>语言模型（pi agent）</h3>
          <select id="cfgLlm"></select>
          <div class="hint">pi 环境已认证的模型；留空则使用 pi 默认模型。</div>
        </section>
        <section>
          <h3>生图 provider</h3>
          <select id="cfgImage"></select>
          <div id="imgKeyWrap">
            <input type="text" id="cfgImageKey" placeholder="API Key">
          </div>
        </section>
        <section>
          <h3>播客 provider</h3>
          <select id="cfgPodcast"></select>
          <div id="podKeyWrap">
            <input type="text" id="cfgPodcastKey" placeholder="Access Token / API Key">
          </div>
          <div id="podAppidWrap">
            <input type="text" id="cfgPodcastAppid" placeholder="appid（火山需填）">
          </div>
        </section>
        <section>
          <h3>自定义 provider（Other）</h3>
          <div id="cfgCustoms"></div>
          <div class="row"><input type="text" id="cName" placeholder="名称"></div>
          <div class="row"><input type="text" id="cBase" placeholder="BaseURL（https://…）"></div>
          <div class="row"><input type="text" id="cKey" placeholder="API Key"><input type="text" id="cModel" placeholder="模型名"></div>
          <button class="ghost" onclick="addCustom()">+ 添加自定义 provider</button>
        </section>
      </div>
      <div class="cfg-foot">
        <button class="ghost" onclick="closeConfig()">取消</button>
        <button onclick="saveConfig()">保存配置</button>
      </div>
    </div>
  </div>
</body>
</html>
