name: Release

# 打 tag（如 v0.3.5）自动构建四平台预编译包并发布 GitHub Release
# 触发: git tag v0.3.5 && git push origin v0.3.5
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,    target: aarch64-apple-darwin }
          - { os: macos-latest,    target: x86_64-apple-darwin }
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Pack
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          BIN="media-factory"
          if [[ "${{ matrix.target }}" == *windows* ]]; then BIN="media-factory.exe"; fi
          strip "$BIN" || true
          tar czf "../../../media-factory-${{ matrix.target }}.tar.gz" "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-factory-${{ matrix.target }}
          path: media-factory-*.tar.gz
          if-no-files-found: error

  # 单独的发布任务：只在所有平台构建完成后创建一次 Release，
  # 避免 4 个矩阵任务各自追加 release notes（导致说明重复 4 次）
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/media-factory-*.tar.gz
          generate_release_notes: true
          draft: false
