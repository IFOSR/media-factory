<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
<script src="./assets/gsap.min.js"></script>
<style>
  :root {
    --W: __WIDTH__px;
    --H: __HEIGHT__px;
    /* 基准边长 = 短边：所有字号/间距按它等比缩放，横竖版观感一致 */
    --S: min(var(--W), var(--H));
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--W); height:var(--H); overflow:hidden; background:#0c0d11; }
  body { font-family:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         -webkit-font-smoothing:antialiased; }
  .scene { position:absolute; inset:0; overflow:hidden; }

  /* 常驻免责声明 */
  #disc { position:absolute; top:calc(var(--S)*.033); right:calc(var(--S)*.044); z-index:40; color:#fbbf24; font-size:calc(var(--S)*.0204);
          letter-spacing:.3px; text-shadow:0 1px 3px rgba(0,0,0,.85); }

  /* ---- 通用标题/文字 ---- */
  h1 { color:#fff; font-weight:700; letter-spacing:calc(var(--S)*-.001); line-height:1.25; }
  h2 { color:#fff; font-weight:700; }
  .accent { color:#6e7bff; }
  .hl { color:#fbbf24; }

  /* ---- cover 封面 ---- */
  .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  .cover .veil { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(12,13,17,.55) 0%, rgba(12,13,17,.15) 40%, rgba(12,13,17,.92) 100%); }
  .cover h1 { position:absolute; left:calc(var(--S)*.102); bottom:calc(var(--S)*.278); font-size:calc(var(--S)*.0796); max-width:calc(var(--S)*1.39); }
  .cover .sub { position:absolute; left:calc(var(--S)*.106); bottom:calc(var(--S)*.204); color:#a5a9ff; font-size:calc(var(--S)*.0352); font-weight:500; }
  .cover .bar { position:absolute; left:calc(var(--S)*.106); bottom:calc(var(--S)*.231); width:calc(var(--S)*.0056); height:calc(var(--S)*.089); background:#6e7bff; border-radius:calc(var(--S)*.003); }

  /* ---- chapter 章节 ---- */
  .chapter { background:radial-gradient(1100px 700px at 30% 45%, #171a2b 0%, #0c0d11 72%);
             display:flex; flex-direction:column; justify-content:center; padding:0 calc(var(--S)*.13); }
  .chapter .idx { font-family:ui-monospace,monospace; color:#6e7bff; font-size:calc(var(--S)*.041); font-weight:700; letter-spacing:calc(var(--S)*.002); }
  .chapter h2 { font-size:calc(var(--S)*.0815); margin-top:calc(var(--S)*.017); }
  .chapter .rule { width:calc(var(--S)*.102); height:calc(var(--S)*.0056); background:#6e7bff; border-radius:calc(var(--S)*.003); margin-top:calc(var(--S)*.028); }

  /* ---- bullets 要点 ---- */
  .bullets { background:#0c0d11; padding:calc(var(--S)*.12) calc(var(--S)*.12) 0; }
  .bullets h2 { font-size:calc(var(--S)*.0593); }
  .bullets h2::after { content:""; display:block; width:calc(var(--S)*.083); height:calc(var(--S)*.0056); background:#6e7bff; margin-top:calc(var(--S)*.020); border-radius:calc(var(--S)*.003); }
  .bullets ul { list-style:none; margin-top:calc(var(--S)*.059); }
  .bullets li { display:flex; align-items:baseline; gap:calc(var(--S)*.022); color:#e8eaee; font-size:calc(var(--S)*.041); font-weight:500;
                padding:calc(var(--S)*.024) 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .bullets li .n { color:#6e7bff; font-size:calc(var(--S)*.0315); font-weight:700; font-family:ui-monospace,monospace; }

  /* ---- metric 数据卡 ---- */
  .metric { background:radial-gradient(1200px 800px at 50% 45%, #171a2b 0%, #0c0d11 70%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .metric .ring2 { position:absolute; width:calc(var(--S)*.907); height:calc(var(--S)*.907); border-radius:50%; border:1px dashed rgba(110,123,255,.14); }
  .metric .ring  { position:absolute; width:calc(var(--S)*.704); height:calc(var(--S)*.704); border-radius:50%; border:2px solid rgba(110,123,255,.25); }
  .metric .num { color:#fff; font-size:calc(var(--S)*.222); font-weight:800; letter-spacing:calc(var(--S)*-.0056); line-height:1;
                 font-variant-numeric:tabular-nums; z-index:2; }
  .metric .num .unit { color:#6e7bff; font-size:calc(var(--S)*.13); font-weight:700; }
  .metric .label { color:#e8eaee; font-size:calc(var(--S)*.048); margin-top:calc(var(--S)*.026); z-index:2; }
  .metric .note { color:#8b90a0; font-size:calc(var(--S)*.026); margin-top:calc(var(--S)*.015); z-index:2; }

  /* ---- quote 金句 ---- */
  .quote { background:linear-gradient(160deg,#101223 0%,#0c0d11 60%); display:flex; flex-direction:column;
           justify-content:center; padding:0 calc(var(--S)*.167); }
  .quote .mark { color:#6e7bff; font-size:calc(var(--S)*.157); line-height:.6; font-family:Georgia,serif; }
  .quote blockquote { color:#f3f4f6; font-size:calc(var(--S)*.0574); font-weight:600; line-height:1.5; margin-top:calc(var(--S)*.028); }
  .quote .who { color:#8b90a0; font-size:calc(var(--S)*.0315); margin-top:calc(var(--S)*.033); }

  /* ---- chart 图表 ---- */
  .chart { background:#0c0d11; padding:calc(var(--S)*.111) calc(var(--S)*.12) 0; }
  .chart h2 { font-size:calc(var(--S)*.0556); }
  .chart .unit { color:#8b90a0; font-size:calc(var(--S)*.028); margin-top:calc(var(--S)*.009); }
  .chart .bars { display:flex; align-items:flex-end; gap:calc(var(--S)*.065); height:calc(var(--S)*.556); margin-top:calc(var(--S)*.065); }
  .chart .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
                height:100%; transform-origin:bottom; }
  .chart .bar i { display:block; width:100%; background:linear-gradient(180deg,#6e7bff,#4b56d6); border-radius:calc(var(--S)*.011) calc(var(--S)*.011) 0 0; }
  .chart .bar.on i { background:linear-gradient(180deg,#fbbf24,#e09b1f); }
  .chart .bar .bv { color:#e8eaee; font-size:calc(var(--S)*.035); font-weight:700; margin-bottom:calc(var(--S)*.013); }
  .chart .bar .bl { color:#8b90a0; font-size:calc(var(--S)*.030); margin-top:calc(var(--S)*.017); }

  /* ---- end 结尾 ---- */
  .end { background:radial-gradient(1000px 700px at 50% 50%, #171a2b 0%, #0c0d11 72%);
         display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .end h2 { font-size:calc(var(--S)*.0704); text-align:center; }
  .end .sub { color:#8b90a0; font-size:calc(var(--S)*.0333); margin-top:calc(var(--S)*.028); }
  /* 竖屏（9:16 等）微调：横向内边距收窄、纵向留白加大 */
  @media (max-aspect-ratio: 1/1) {
    .bullets { padding:calc(var(--S)*.09) calc(var(--S)*.085) 0; }
    .bullets ul { margin-top:calc(var(--S)*.075); }
    .bullets li { font-size:calc(var(--S)*.043); }
    .chapter { padding:0 calc(var(--S)*.10); }
    .quote { padding:0 calc(var(--S)*.12); }
    .quote blockquote { font-size:calc(var(--S)*.060); }
    .chart { padding:calc(var(--S)*.10) calc(var(--S)*.09) 0; }
    .chart .bars { height:calc(var(--S)*.46); gap:calc(var(--S)*.05); }
    .metric .num { font-size:calc(var(--S)*.20); }
    .cover h1 { bottom:calc(var(--S)*.32); }
    .cover .sub { bottom:calc(var(--S)*.25); }
    .cover .bar { bottom:calc(var(--S)*.275); }
  }
</style>
</head>
<body>
<div id="root"
     data-composition-id="main"
     data-start="0"
     data-duration="__DURATION__"
     data-width="__WIDTH__"
     data-height="__HEIGHT__"
     data-fps="__FPS__">

  <div id="disc" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="90">__DISCLAIMER__</div>

__SCENES__

</div>

<script>
  const SCENES = __SCENE_DATA__;
  const tl = gsap.timeline({ paused: true });
  const q = (sel) => document.querySelector(sel);
  const qa = (sel) => Array.from(document.querySelectorAll(sel));

  SCENES.forEach((s) => {
    const sel = '#s' + s.i;
    const dur = Math.max(0.4, s.end - s.start);

    // 统一：淡入 + 淡出（末尾 0.4s）
    tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, s.start);
    if (dur > 0.8) tl.to(sel, { opacity: 0, duration: 0.35, ease: "power1.in" }, Math.max(s.start, s.end - 0.35));

    if (s.type === "cover") {
      const img = q(sel + " img");
      if (img) tl.fromTo(img, { scale: 1.0 }, { scale: 1.07, duration: dur, ease: "none" }, s.start);
      const bar = q(sel + " .bar");
      if (bar) tl.fromTo(bar, { height: 0 }, { height: 96, duration: 0.5, ease: "power3.out" }, s.start + 0.1);
      const h1 = q(sel + " h1");
      if (h1) tl.fromTo(h1, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, s.start + 0.25);
      const sub = q(sel + " .sub");
      if (sub) tl.fromTo(sub, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7 }, s.start + 0.5);
    }

    if (s.type === "chapter") {
      const idx = q(sel + " .idx");
      if (idx) tl.fromTo(idx, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, s.start + 0.15);
      const h2 = q(sel + " h2");
      if (h2) tl.fromTo(h2, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, s.start + 0.35);
      const rule = q(sel + " .rule");
      if (rule) tl.fromTo(rule, { width: 0 }, { width: 110, duration: 0.6, ease: "power3.out" }, s.start + 0.7);
    }

    if (s.type === "bullets") {
      const h2 = q(sel + " h2");
      if (h2) tl.fromTo(h2, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, s.start + 0.15);
      const lis = qa(sel + " li");
      const step = Math.min(0.9, Math.max(0.5, (dur - 1.2) / Math.max(1, lis.length)));
      lis.forEach((li, k) => {
        tl.fromTo(li, { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, s.start + 0.7 + k * step);
      });
    }

    if (s.type === "metric") {
      const ring2 = q(sel + " .ring2");
      if (ring2) tl.fromTo(ring2, { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, s.start + 0.1);
      const ring = q(sel + " .ring");
      if (ring) tl.fromTo(ring, { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .9, ease: "power2.out" }, s.start + 0.25);
      const num = q(sel + " .num");
      if (num) tl.fromTo(num, { opacity: 0, scale: .94 }, { opacity: 1, scale: 1, duration: .6, ease: "power2.out" }, s.start + 0.2);
      const val = q(sel + " .val");
      const target = s.value_num;
      if (val && typeof target === "number" && isFinite(target)) {
        const cnt = { v: 0 };
        const decimals = s.value_decimals || 0;
        tl.to(cnt, {
          v: target, duration: Math.min(1.6, dur * 0.5), ease: "power2.out",
          onUpdate: () => { val.textContent = cnt.v.toFixed(decimals); }
        }, s.start + 0.3);
      }
      const label = q(sel + " .label");
      if (label) tl.fromTo(label, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .6 }, s.start + 0.6);
      const note = q(sel + " .note");
      if (note) tl.fromTo(note, { opacity: 0 }, { opacity: 1, duration: .6 }, s.start + 1.0);
    }

    if (s.type === "quote") {
      const mark = q(sel + " .mark");
      if (mark) tl.fromTo(mark, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5 }, s.start + 0.15);
      const bq = q(sel + " blockquote");
      if (bq) tl.fromTo(bq, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .7, ease: "power3.out" }, s.start + 0.35);
      const who = q(sel + " .who");
      if (who) tl.fromTo(who, { opacity: 0 }, { opacity: 1, duration: .6 }, s.start + 0.8);
    }

    if (s.type === "chart") {
      const h2 = q(sel + " h2");
      if (h2) tl.fromTo(h2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .6, ease: "power3.out" }, s.start + 0.15);
      const bars = qa(sel + " .bar");
      bars.forEach((b, k) => {
        tl.fromTo(b, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: .6, ease: "power2.out" },
                  s.start + 0.6 + k * 0.15);
      });
    }

    if (s.type === "end") {
      const h2 = q(sel + " h2");
      if (h2) tl.fromTo(h2, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .7, ease: "power3.out" }, s.start + 0.2);
      const sub = q(sel + " .sub");
      if (sub) tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: .6 }, s.start + 0.7);
    }
  });

  // 免责声明全程常驻
  tl.fromTo("#disc", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
